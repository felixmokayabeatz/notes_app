<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - NoteFlow</title>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    {% load static %}
    <link rel="stylesheet" href="{% static 'core/css/forgot_password.css' %}">
</head>
<body>
    <div id="particles-js"></div>

    <div class="container">
        <div class="logo">NoteFlow</div>
        <h2>Reset Your Password</h2>
        <p class="description">Enter your email address and we'll send you a link to reset your password.</p>
        
        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            
            <button type="submit">Send Reset Link</button>
        </form>
        
        <div class="links">
            <a href="/login">Back to Login</a>
            <a href="/">← Back to Homepage</a>
        </div>
    </div>

    <script>
        // Particles.js configuration
        particlesJS('particles-js', {
            particles: {
                number: { value: 60 },
                color: { value: '#ffffff' },
                opacity: { value: 0.3 },
                size: { value: 3 },
                line_linked: {
                    enable: true,
                    distance: 150,
                    color: '#ffffff',
                    opacity: 0.1
                }
            }
        });

        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const button = e.target.querySelector('button');
            const originalText = button.textContent;
            
            try {
                button.textContent = 'Sending...';
                button.disabled = true;
                
                const response = await fetch('/users/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    // Show success message
                    const successDiv = document.createElement('div');
                    successDiv.className = 'success-message';
                    successDiv.textContent = 'If the email exists, a password reset link has been sent. Please check your inbox.';
                    
                    const form = document.getElementById('forgotPasswordForm');
                    form.parentNode.insertBefore(successDiv, form);
                } else {
                    alert(result.detail || 'An error occurred');
                }
            } catch (error) {
                alert('An error occurred. Please try again.');
            } finally {
                button.textContent = originalText;
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
