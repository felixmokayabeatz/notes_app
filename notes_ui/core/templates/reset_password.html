<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - NoteFlow</title>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    {% load static %}
    <link rel="stylesheet" href="{% static 'core/css/reset_password.css' %}">
</head>
<body>
    <div id="particles-js"></div>

    <div class="container">
        <div class="logo">NoteFlow</div>
        <h2>Create New Password</h2>
        
        <div id="errorMessage" class="error-message" style="display: none;"></div>
        
        <form id="resetPasswordForm">
            <input type="hidden" id="resetToken" value="">
            
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" name="new_password" placeholder="Enter new password" required minlength="6">
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
            </div>
            
            <button type="submit">Reset Password</button>
        </form>
        
        <div class="links">
            <a href="/login">Back to Login</a>
        </div>
    </div>

    <script>
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (!token) {
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('errorMessage').textContent = 'Invalid reset link. Please request a new password reset.';
            document.getElementById('resetPasswordForm').style.display = 'none';
        } else {
            document.getElementById('resetToken').value = token;
        }

        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const token = document.getElementById('resetToken').value;
            
            if (newPassword !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }
            
            if (newPassword.length < 6) {
                alert('Password must be at least 6 characters long');
                return;
            }
            
            const button = e.target.querySelector('button');
            const originalText = button.textContent;
            
            try {
                button.textContent = 'Resetting...';
                button.disabled = true;
                
                const response = await fetch('/users/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        token: token,
                        new_password: newPassword
                    })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    // Show success message and redirect
                    const successDiv = document.createElement('div');
                    successDiv.className = 'success-message';
                    successDiv.textContent = 'Password reset successfully! Redirecting to login...';
                    
                    const form = document.getElementById('resetPasswordForm');
                    form.parentNode.insertBefore(successDiv, form);
                    form.style.display = 'none';
                    
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    document.getElementById('errorMessage').style.display = 'block';
                    document.getElementById('errorMessage').textContent = result.detail || 'An error occurred';
                }
            } catch (error) {
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('errorMessage').textContent = 'An error occurred. Please try again.';
            } finally {
                button.textContent = originalText;
                button.disabled = false;
            }
        });

        // Particles.js configuration
        particlesJS('particles-js', {
            particles: {
                number: { value: 60 },
                color: { value: '#ffffff' },
                opacity: { value: 0.3 },
                size: { value: 3 },
                line_linked: {
                    enable: true,
                    distance: 150,
                    color: '#ffffff',
                    opacity: 0.1
                }
            }
        });
    </script>
</body>
</html>
